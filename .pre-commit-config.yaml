# This file contains pre-commit checks.
# See https://github.com/j178/prek for details.

---
exclude: ^LICENSES/.*|^tools/aspell\.en\.pws

default_install_hook_types: [pre-commit, commit-msg]

repos:
 - repo: https://github.com/pre-commit/pre-commit-hooks
   rev: v6.0.0
   hooks:
    - id: check-added-large-files
      name: check-added-large-files
      args: [--enforce-all]
    - id: check-case-conflict
      name: check-case-conflict
    - id: check-illegal-windows-names
      name: check-illegal-windows-names
    - id: check-merge-conflict
      name: check-merge-conflict
    - id: check-toml
      name: check-toml
    - id: check-vcs-permalinks
      name: check-vcs-permalinks
    - id: fix-byte-order-marker
      name: fix-byte-order-marker
    - id: forbid-submodules
      name: forbid-submodules
    - id: requirements-txt-fixer
      name: requirements-txt-fixer

 - repo: meta
   hooks:
    - id: check-hooks-apply
      name: check-hooks-apply
    - id: check-useless-excludes
      name: check-useless-excludes

 # https://reuse.software/
 - repo: https://github.com/fsfe/reuse-tool
   rev: v6.2.0
   hooks:
    - id: reuse
      name: reuse

 # https://docs.astral.sh/ruff/
 - repo: https://github.com/astral-sh/ruff-pre-commit
   rev: v0.16.5
   hooks:
    - id: ruff-check
      name: ruff-check
      args: [--fix]
    - id: ruff-format
      name: ruff-format

 - repo: https://github.com/crate-ci/typos
   rev: v1.49.1
   hooks:
    - id: typos
      name: typos
      exclude: ^(?=.*\.csv)(?!.*en_US\.csv)
      stages: [pre-commit]
      args: []
    - id: typos
      stages: [commit-msg]
      args: []

 - repo: https://github.com/compilerla/conventional-pre-commit
   rev: v4.4.0
   hooks:
    - id: conventional-pre-commit
      stages: [commit-msg]
      args:
       [--strict,
        --verbose,
        --force-scope,
        --scopes,
        "10.5x,\
        Autoautosave,\
        ClematisM,\
        DoomDoctor,\
        FinalCustomDoom,\
        Gearbox,\
        Graveyard,\
        Hint,\
        HitImpact,\
        LazyPoints,\
        LispOnZscript,\
        MD5,\
        Nomina,\
        PreciseCrosshair,\
        PreviousWeapon,\
        SoundToScreen,\
        StringUtils,\
        TargetSpy,\
        Typist.pk3,\
        VmAbortReporter,\
        WarmReception,\
        l10n,\
        libeye,\
        project",
        build, chore, docs, feat, fix, refactor, style, test]

 - repo: https://github.com/oxipng/oxipng
   rev: v10.2.0
   hooks:
    - id: oxipng
      name: oxipng
      args: [-o, "4", --alpha]

 - repo: https://github.com/adrienverge/yamllint.git
   rev: v1.38.0
   hooks:
    - id: yamllint
      name: yamllint
      exclude: ^\.clang-format
      args:
       [-d,
        "{extends: default, rules: {\
        empty-values: enable, \
        line-length: disable, \
        new-line-at-end-of-file: disable, \
        new-lines: disable, \
        octal-values: enable, \
        quoted-strings: {quote-type: double, required: false}, \
        trailing-spaces: disable, \
        truthy: disable\
        }}",
        --strict]

 - repo: https://github.com/editorconfig-checker/editorconfig-checker
   rev: v3.11.2
   hooks:
    - id: editorconfig-checker
      name: editorconfig-checker
      exclude:
       "^modules/(libeye.org|MD5.org)|\
       ^tools/(htmlize.el|.*.css|.*.wad)"
      args: [-disable-indent-size]

 - repo: local
   hooks:
    - id: punctuation
      name: punctuation
      exclude: .*\.(gif|ogg|png|wad)
      language: pygrep
      # Forbidden characters:
      # - U+FFFD UTF-8 Unicode replacement character
      # - U+2018 LEFT SINGLE QUOTATION MARK
      # - U+2019 RIGHT SINGLE QUOTATION MARK
      # - U+201A SINGLE LOW-9 QUOTATION MARK
      # - U+201B SINGLE HIGH-REVERSED-9 QUOTATION MARK
      # - U+201C LEFT DOUBLE QUOTATION MARK
      # - U+201D RIGHT DOUBLE QUOTATION MARK
      # - U+201E DOUBLE LOW-9 QUOTATION MARK
      # - U+201F DOUBLE HIGH-REVERSED-9 QUOTATION MARK
      # - U+2E42 DOUBLE LOW-REVERSED-9 QUOTATION MARK
      entry: "\uFFFD|\u2018|\u2019|\u201A|\u201B|\u201C|\u201D|\u201E|\u201F|\u2E42"

    # Emacs Org mode sometimes puts commas before '*' so '*' don't count as titles.
    - id: comma-star
      name: comma-star
      types: [file]
      files: \.org$
      language: pygrep
      entry: ",[*]"

 # https://vale.sh/
 - repo: https://github.com/vale-cli/vale
   rev: v3.19.0
   hooks:
    - id: vale
      name: vale sync
      pass_filenames: false
      args: [sync]
    - id: vale
      args: [--output=line]
      exclude: ^documentation/CodeOfConduct\.org
