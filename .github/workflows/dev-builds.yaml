# GitHub Action for dev builds
# https://docs.github.com/en/actions
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

# Devbuilds release creation steps are based on UZDoom workflow.

---
name: dev-builds

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we want
# to allow these production deployments to complete.
concurrency:
  group: 'dev-build'
  cancel-in-progress: false

jobs:
  hooks:
    permissions:
      actions: read
    runs-on: ubuntu-26.04

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - parallel:
          - name: Install Python
            uses: actions/setup-python@v7
            with:
              python-version: '3.13'
              cache: 'pip'
              cache-dependency-path: 'tools/requirements-dev.txt'

          - name: Cache prek
            id: prek
            uses: actions/cache@v6
            with:
              path: ~/.cache/prek
              key: ${{ runner.os }}-prek-v${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements-dev.txt

      - name: Check prek hooks
        run: |
          prek run -a

  test:
    needs: hooks
    permissions:
      actions: read
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        engine:
          - name: uzdoom-v4.14.3
            url: https://github.com/UZDoom/UZDoom/releases/download/4.14.3/Linux-UZDoom-4.14.3.AppImage
            download-target: ~/UZDoom.AppImage
            bin: ~/UZDoom.AppImage
          - name: lzdoom-v4.14.3a
            url: https://github.com/drfrag666/lzdoom/releases/download/l4.14.3a/lzdoom_4.14.3a_amd64.deb
            download-target: ~/lzdoom.deb
            bin: lzdoom
          - name: uzdoom-preview
            url: https://github.com/UZDoom/UZDoom/releases/download/x-preview/Linux-UZDoom-Preview-x86_64.AppImage
            download-target: ~/UZDoom.AppImage
            bin: ~/UZDoom.AppImage
          - name: uzdoom-v5.0.0-rc.1
            url: https://github.com/UZDoom/UZDoom/releases/download/5.0.0-rc.1/Linux-UZDoom-Release-x86_64.AppImage
            download-target: ~/UZDoom.AppImage
            bin: ~/UZDoom.AppImage

    env:
      DT_ENGINE: ${{ matrix.engine.bin }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - parallel:
          - name: Install system dependencies
            uses: awalsh128/cache-apt-pkgs-action@v1
            with:
              # espeak-ng, libespeak1: for pyttsx3
              # ffmpeg: for python-ffmpeg
              # libsdl2-2.0-0, libvorbisenc2, libopus0, libmpg123-0, libmp3lame0: lzdoom
              packages: libfuse2t64 libpulse0 libsdl2-2.0-0 emacs-nox espeak-ng libespeak1 ffmpeg libsdl2-2.0-0 libvorbisenc2 libopus0 libmpg123-0 libmp3lame0
              version: 1.0.0
              execute_install_scripts: true

          - name: Cache engine
            id: cache-engine
            if: ${{ !contains(matrix.engine.name, 'preview') }}
            uses: actions/cache@v6
            with:
              path: ${{ matrix.engine.download-target }}
              key: ${{ runner.os }}-${{ matrix.engine.name }}

          - name: Install Python
            uses: actions/setup-python@v7
            with:
              python-version: '3.13'
              cache: 'pip'
              cache-dependency-path: 'tools/requirements-dev.txt'

      - name: Download engine
        if: ${{ steps.cache-engine.outputs.cache-hit != 'true' }}
        run: |
          wget -qO- ${{ matrix.engine.url }} > ${{ matrix.engine.download-target }}

      - parallel:
          - name: Set up engine with dpkg
            if: ${{ contains(matrix.engine.download-target, '.deb') }}
            run: |
              sudo dpkg -i ${{ matrix.engine.download-target }}

          - name: Set up engine with chmod
            if: ${{ contains(matrix.engine.download-target, '.AppImage') }}
            run: |
              chmod +x ${{ matrix.engine.download-target }}

          - name: Install Python dependencies
            run: |
              python -m pip install --upgrade pip
              pip install -r tools/requirements-dev.txt

      - name: Check compatibility
        run: |
          xvfb-run --server-args "-screen 0 640x480x24" --auto-servernum scons -j 4 CheckCompatibility

      - name: Test
        run: |
          xvfb-run --server-args "-screen 0 640x480x24" --auto-servernum scons TestAll

  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: test
    permissions:
      actions: read
      # Allow to create dev-builds tag:
      contents: write
      # Allow deployment to GitHub Pages:
      id-token: write
      pages: write
    runs-on: ubuntu-26.04

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - parallel:
          - name: Install system dependencies
            uses: awalsh128/cache-apt-pkgs-action@v1
            with:
              # espeak-ng, libespeak1: for pyttsx3
              # ffmpeg: for python-ffmpeg
              packages: emacs-nox espeak-ng libespeak1 ffmpeg
              version: 1.0.0
              execute_install_scripts: true

          - name: Install Python
            uses: actions/setup-python@v7
            with:
              python-version: '3.13'
              cache: 'pip'
              cache-dependency-path: 'tools/requirements-dev.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements-dev.txt

      - name: Build
        run: |
          scons Pk3All
          scons PackModules

      - name: Devbuilds - prepare
        run: |
          git tag -d dev-builds || true
          git push origin :refs/tags/dev-builds || true
          git tag dev-builds ${{ github.event.workflow_run.head_sha }}
          git push origin dev-builds
          zip -r build/DoomToolbox build -i \*.pk3 build/modules/\*.zs

      - name: Devbuilds - upload
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: DoomToolbox Devbuilds
          tag_name: dev-builds
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false
          files: build/DoomToolbox.zip
          body: |
            Warning: these packages may contain bugs or unfinished features.

      - name: Clean up build
        run: |
          rm -r build

      - name: Export to HTML
        run: |
          scons -j 4 HtmlAll

      - name: Configure pages
        uses: actions/configure-pages@v6

      - name: Upload pages
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy pages to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build_windows:
    runs-on: windows-2022
    env:
      emacs-version: '30.1.0'

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - parallel:
          - name: Cache Emacs
            id: cache-emacs
            uses: actions/cache@v6
            with:
              path: c:\tools\emacs
              key: ${{ runner.os }}-emacs-v${{ env.emacs-version }}

          - name: Install Python
            uses: actions/setup-python@v7
            with:
              python-version: '3.13'
              cache: 'pip'
              cache-dependency-path: 'tools/requirements-dev.txt'

          - name: Cache prek
            id: prek
            uses: actions/cache@v6
            with:
              path: ~/.cache/prek
              key: ${{ runner.os }}-prek-v${{ hashFiles('.pre-commit-config.yaml') }}

      - parallel:
          # TODO: add emacs to PATH.
          - if: ${{ steps.cache-emacs.outputs.cache-hit != 'true' }}
            name: Install Emacs
            run: |
              choco install emacs --version ${{ env.emacs-version }}

          - name: Install Python dependencies
            shell: bash
            run: |
              python -m pip install --upgrade pip
              pip install -r tools/requirements-dev.txt

      # No point if I cannot run UZDoom (see comments below).
      # - name: Cache UZDoom
      #   id: cache-uzdoom
      #   uses: actions/cache@v6
      #   with:
      #     path: ~/UZDoom
      #     key: ${{ runner.os }}-uzdoom-v4.14.3
      #
      # - if: ${{ steps.cache-uzdoom.outputs.cache-hit != 'true' }}
      #   name: Install UZDoom
      #   shell: bash
      #   run: |
      #     curl -kLSs https://github.com/UZDoom/UZDoom/releases/download/4.14.3/Windows-UZDoom-4.14.3.zip -o ~/UZDoom.zip
      #     mkdir -p ~/UZDoom
      #     unzip ~/UZDoom.zip -d ~/UZDoom

      - name: Check prek hooks
        run: |
          prek run -a

      # I couldn't make UZDoom work here. Most probably because of missing video drivers.
      # - name: try UZDoom
      #   run: |
      #     ~/UZDoom/uzdoom.exe -stdout -nosound -nodraw -iwad tools/miniwad.wad -config tools/config.ini +"map map01; wait 2; quit"

      #  At least check that scons works.
      - name: Build
        run: |
          scons -j 4 Pk3All
          Get-ChildItem -Path build
