# GitHub Action for dev builds
# https://docs.github.com/en/actions
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

# Devbuilds release creation steps are based on UZDoom workflow.

---
name: dev-builds

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we want
# to allow these production deployments to complete.
concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  hooks:
    permissions:
      actions: read
    runs-on: ubuntu-26.04

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Cache prek
        id: cache-prek
        background: true
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-v${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements-dev.txt

      - name: Wait for prek
        wait: [cache-prek]

      - name: Check prek hooks
        run: |
          prek run -a

  test:
    needs: hooks
    permissions:
      actions: read
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        engine:
          - name: uzdoom-v4.14.3
            url: https://github.com/UZDoom/UZDoom/releases/download/4.14.3/Linux-UZDoom-4.14.3.AppImage
            download-target: ~/UZDoom.AppImage
            bin: ~/UZDoom.AppImage
          - name: lzdoom-v4.14.3a
            url: https://github.com/drfrag666/lzdoom/releases/download/l4.14.3a/lzdoom_4.14.3a_amd64.deb
            download-target: ~/lzdoom.deb
            bin: lzdoom
          - name: uzdoom-preview
            url: https://github.com/UZDoom/UZDoom/releases/download/x-preview/Linux-UZDoom-Preview-x86_64.AppImage
            download-target: ~/UZDoom.AppImage
            bin: ~/UZDoom.AppImage
          - name: uzdoom-v5.0.0
            url: https://github.com/UZDoom/UZDoom/releases/download/5.0.0/Linux-UZDoom-Release-x86_64.AppImage
            download-target: ~/UZDoom.AppImage
            bin: ~/UZDoom.AppImage

    env:
      DT_ENGINE: ${{ matrix.engine.bin }}

    steps:
      - name: Install system dependencies
        id: install-system-dependencies
        background: true
        # espeak-ng, libespeak1: for pyttsx3
        # ffmpeg: for python-ffmpeg
        # libsdl2-2.0-0, libvorbisenc2, libopus0, libmpg123-0, libmp3lame0: lzdoom
        run: |
          sudo apt-get update
          sudo apt-get install libfuse2t64 libpulse0 libsdl2-2.0-0 emacs-nox espeak-ng libespeak1 ffmpeg libsdl2-2.0-0 libvorbisenc2 libopus0 libmpg123-0 libmp3lame0

      - name: Cache engine
        id: cache-engine
        background: true
        if: ${{ !contains(matrix.engine.name, 'preview') }}
        uses: actions/cache@v6
        with:
          path: ${{ matrix.engine.download-target }}
          key: ${{ runner.os }}-${{ matrix.engine.name }}

      - name: Check out
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements-dev.txt

      - name: Wait for engine cache
        wait: cache-engine

      - name: Download engine
        if: ${{ steps.cache-engine.outputs.cache-hit != 'true' }}
        run: |
          wget -qO- ${{ matrix.engine.url }} > ${{ matrix.engine.download-target }}

      - name: Wait for system
        wait: install-system-dependencies

      - name: Set up engine with dpkg
        if: ${{ contains(matrix.engine.download-target, '.deb') }}
        run: |
          sudo dpkg -i ${{ matrix.engine.download-target }}

      - name: Set up engine with chmod
        if: ${{ contains(matrix.engine.download-target, '.AppImage') }}
        run: |
          chmod +x ${{ matrix.engine.download-target }}

      - name: Check compatibility
        run: |
          xvfb-run --server-args "-screen 0 640x480x24" --auto-servernum scons -j 4 CheckCompatibility

      - name: Upload build directory
        id: upload-build-directory
        uses: actions/upload-artifact@v7
        background: true
        if: ${{ matrix.engine.name == 'uzdoom-v5.0.0' }}
        with:
          path: build
          if-no-files-found: error

      - name: Upload build database
        id: upload-build-database
        uses: actions/upload-artifact@v7
        background: true
        if: ${{ matrix.engine.name == 'uzdoom-v5.0.0' }}
        with:
          path: .sconsign.dblite
          include-hidden-files: true
          if-no-files-found: error

      - name: Test
        run: |
          xvfb-run --server-args "-screen 0 640x480x24" --auto-servernum scons TestAll

      - name: Wait for build directory upload
        wait: upload-build-directory

      - name: Wait for build database upload
        wait: upload-build-database

  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [test, build_windows]
    permissions:
      actions: read
      # Allow deployment to GitHub Pages:
      id-token: write
      pages: write
    runs-on: ubuntu-26.04

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download build artifacts
        id: download-build-artifacts
        uses: actions/download-artifact@v8
        background: true

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements-dev.txt

      - name: Wait for build artifacts
        wait: download-build-artifacts

      - name: Build
        run: |
          scons Pk3All
          scons PackModules
          date --utc --rfc-3339=seconds > build/timestamp.txt
          for m in build/mutators/*; do zip -jr build/$(basename $m).pk3 $m; done
          zip -r DoomToolbox build -i \*.pk3 build/modules/\*.zs build/timestamp.txt
          rm -r build
          scons -j 4 HtmlAll

      - name: Configure pages
        uses: actions/configure-pages@v6

      - name: Upload pages
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: .

      - name: Deploy pages to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Couldn't make UZDoom work here. Most probably because of missing video drivers.
  build_windows:
    needs: hooks
    runs-on: windows-2022
    env:
      emacs-version: 30.1.0

    steps:
      - name: Cache Emacs
        id: cache-emacs
        background: true
        uses: actions/cache@v6
        with:
          path: c:\tools\emacs
          key: ${{ runner.os }}-emacs-v${{ env.emacs-version }}

      - name: Check out
        uses: actions/checkout@v7

      - name: Cache prek
        id: cache-prek
        background: true
        uses: actions/cache@v6
        with:
          path: c:\Users\runneradmin\AppData\Local\prek
          key: ${{ runner.os }}-prek-v${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements-dev.txt

      - name: Wait for prek
        wait: [cache-prek]

      - name: Check prek hooks
        run: |
          prek run -a

      - name: Wait for emacs cache
        wait: cache-emacs

      # TODO: add emacs to PATH.
      - if: ${{ steps.cache-emacs.outputs.cache-hit != 'true' }}
        name: Install Emacs
        run: |
          choco install emacs --version ${{ env.emacs-version }}

      #  At least check that scons works.
      - name: Build
        run: |
          scons -j 4 Pk3All
          Get-ChildItem -Path build
          Write-Host "current user:"
          Write-Host $(whoami)
